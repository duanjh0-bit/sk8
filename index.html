<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SK8" />
    <title>SK8</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header id="topBar" class="top-bar"></header>
      <div id="segmentedBar" class="segmented" role="tablist"></div>
      <main id="mainContent" class="main-content"></main>
      <div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>
    </div>

    <!-- 今日攻坚选招弹窗 -->
    <div id="pickerModal" class="modal-backdrop" hidden>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="选择今日攻坚">
        <div class="sheet-header">
          <h2 class="sheet-title">今日攻坚</h2>
          <button type="button" id="pickerCloseBtn" class="sheet-close-btn" aria-label="关闭">×</button>
        </div>
        <div id="pickerBody" class="sheet-body"></div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
